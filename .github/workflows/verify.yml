name: Verify archived results
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-audit.txt
      - run: python -m pip install -r requirements-audit.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_artifacts.py
      - run: python scripts/verify_baseline_results.py
      - run: python scripts/verify_cs_results.py
      - name: Check generated Kaggle bundles
        run: |
          python scripts/build_cs_kernel.py
          python scripts/build_cs_kernel.py --smoke
          # Compressed bytes can differ across zlib versions; source hashes cannot.
          git diff --exit-code -- kaggle/openvla_cs kaggle/openvla_cs_smoke/source-hashes.json
          python scripts/build_motion_kernels.py
          git diff --exit-code -- kaggle/motion_jaco/source-hashes.json kaggle/motion_nyu_door/source-hashes.json
